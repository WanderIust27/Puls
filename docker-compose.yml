services:
  puls:
    build: .
    container_name: puls-coach
    restart: unless-stopped
    ports:
      # Host-Port über die .env änderbar (PULS_PORT), Standard 1337
      - "${PULS_PORT:-1337}:8000"
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - OLLAMA_URL=http://ollama:11434
      # Standardmodell: gutes Deutsch, ~4.7 GB RAM auf CPU. Kleinere Alternative
      # in der App unter Mehr → KI-Modell wechselbar (auch qwen3:4b, gemma3:4b)
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-3}
      # Einbettungsmodell der Wissensdatenbank: minilm (ONNX, schlank) oder
      # e5 (braucht zusaetzlich sentence-transformers und damit PyTorch).
      - PULS_EMBED=${PULS_EMBED:-minilm}
    volumes:
      - puls-data:/data
      # Die Wissensdatenbank als Bind-Mount, damit du die Markdown-Dateien auf
      # dem Server bearbeiten kannst, ohne das Image neu zu bauen. Nur lesen.
      - ${PULS_KB_DIR:-./knowledge}:/knowledge:ro
      # Modell-Cache. Ohne ihn laedt der Container das Einbettungsmodell bei
      # jedem Neustart neu — 220 MB, jedes Mal.
      - puls-models:/models
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: puls-ollama
    restart: unless-stopped
    environment:
      # RAM-Schutz: nur 1 Modell gleichzeitig, nach 30 min entladen
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      # Grafikkarte: leer = CPU. In der .env OLLAMA_GPU=all setzen (oder die
      # UUID aus `nvidia-smi -L`), dann rechnet Ollama auf der Karte. Dafür
      # muss die nvidia-Runtime da sein — auf Unraid das Plugin
      # "Nvidia Driver" aus den Community Apps, danach einmal neu starten.
      - NVIDIA_VISIBLE_DEVICES=${OLLAMA_GPU:-}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # runc = CPU (Standard). Mit OLLAMA_RUNTIME=nvidia in der .env wird die
    # Karte benutzt; beide Zeilen gehören zusammen.
    #
    # Falls deine Docker-Version die nvidia-Runtime nicht kennt, aber
    # --gpus beherrscht, nimm stattdessen den Block darunter und lass
    # runtime auf runc stehen.
    runtime: ${OLLAMA_RUNTIME:-runc}
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    volumes:
      - ollama-data:/root/.ollama
    # Optional RAM hart begrenzen:
    # mem_limit: 7g

  # Bluetooth-Brücke zur Mi Scale.
  # Der Container bringt seinen eigenen Bluetooth-Stack mit (dbus + bluetoothd),
  # weil Unraid keinen hat — auf dem Server muss also nichts installiert werden.
  # Deshalb wird /var/run/dbus bewusst NICHT vom Host gemountet.
  # Wenn du keine Waage anbinden willst: diesen Block einfach löschen.
  miscale:
    build: ./miscale
    container_name: puls-miscale
    restart: unless-stopped
    network_mode: host      # BLE braucht den Netzwerk-Stack des Hosts
    privileged: true        # Zugriff auf den HCI-Socket des Adapters
    # Alle persönlichen Werte stehen in der Datei .env daneben — die wird bei
    # einem Update NICHT überschrieben. Einmal anlegen:  cp .env.example .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Muss zum Port oben passen — beides steht in der .env
      - PULS_URL=${PULS_URL:-http://localhost:1337}
      - PULS_TOKEN=${PULS_TOKEN:-}
      - SCALE_MAC=${SCALE_MAC:-}
      - HEIGHT_CM=${HEIGHT_CM:-180}
      - AGE=${AGE:-25}
      - SEX=${SEX:-male}
      - MIN_WEIGHT_KG=${MIN_WEIGHT_KG:-40}
      - COOLDOWN_S=${COOLDOWN_S:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

# Die Volumes werden bewusst als "external" geführt: Dann heißen sie exakt
# puls-data und ollama-data — egal, wie der Stack heißt. Ohne dieses Flag würde
# Compose den Stacknamen davorhängen und deine vorhandenen Daten ignorieren.
# Einmalig vorher anlegen (schadet nicht, wenn sie schon existieren):
#     docker volume create puls-data
#     docker volume create ollama-data
volumes:
  puls-data:
    external: true
  ollama-data:
    external: true
  # Nicht external: Der Modell-Cache ist Wegwerfgut und darf mit dem Stack
  # entstehen. Faellt er weg, wird das Modell eben neu geladen.
  puls-models:
